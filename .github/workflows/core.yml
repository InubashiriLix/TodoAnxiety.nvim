name: Rust core

on:
  push:
    paths:
      - "core/**"
      - ".github/workflows/core.yml"
  pull_request:
    paths:
      - "core/**"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: todo-core-linux-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: todo-core-macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: todo-core-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: todo-core-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Test core
        run: cargo test --manifest-path core/Cargo.toml
      - name: Build release core
        run: cargo build --release --manifest-path core/Cargo.toml --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: core/target/${{ matrix.target }}/release/todo-core${{ matrix.os == 'windows-latest' && '.exe' || '' }}
