# Include inside an existing HTTPS server block with a valid certificate.
# Requires nginx-limits.conf in the enclosing http {} block.
# Client sync.url must include /todo-sync, without /v1 or a trailing slash.
location ^~ /todo-sync/ {
    limit_req zone=todo_sync_ip burst=40;
    limit_req_status 429;
    limit_conn todo_sync_conn_ip 8;
    limit_conn todo_sync_conn_total 32;
    limit_conn_status 429;
    client_max_body_size 11m;
    client_body_timeout 15s;
    send_timeout 30s;
    add_header Cache-Control "no-store" always;
    proxy_pass http://127.0.0.1:8787/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}
